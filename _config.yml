theme: jekyll-theme-cayman
title: Dominique Marmen
description: "Passionnée par l'économie et les sciences sociales, je m'intéresse à la manière dont nous organisons les sociétés.
Je souhaite participer à la transformation numérique et faire partie de ceux et celles qui travailleront à construire les sociétés de demain.
Je m’intéresse particulièrement au futur de nos systèmes monétaires."
